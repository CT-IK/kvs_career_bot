version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kvs_bot_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-kvs_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kvs_bot_network

  bot:
    build: .
    container_name: kvs_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kvs_bot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GOOGLE_SHEETS_URL: ${GOOGLE_SHEETS_URL:-}
      GOOGLE_CREDENTIALS_FILE: ${GOOGLE_CREDENTIALS_FILE:-credentials.json}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-}
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials.json:/app/credentials.json:ro
      - images_cache:/app/cache/images
    restart: unless-stopped
    networks:
      - kvs_bot_network

volumes:
  postgres_data:
  images_cache:

networks:
  kvs_bot_network:
    driver: bridge

